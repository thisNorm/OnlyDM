<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
    <title>OnlyDM</title>
    <link rel="stylesheet" href="shell.css">
    <script src="shell.js" defer></script>
  </head>
  <body data-pane="login">
    <nav id="nav-rail" aria-label="OnlyDM" hidden>
      <span id="chats-icon" class="rail-icon selected" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H9l-4.4 3v-4.2A3 3 0 0 1 4 15z"/>
          <path d="M8.5 10.5h.01m3.5 0h.01m3.5 0h.01"/>
        </svg>
      </span>
      <button type="button" id="settings" class="icon rail-icon" aria-label="설정" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9.6 3h4.8l.5 2.5 1.6.9 2.4-.8 2.4 4.2-1.8 1.7v1.9l1.8 1.7-2.4 4.2-2.4-.8-1.6.9-.5 2.6H9.6l-.5-2.6-1.6-.9-2.4.8-2.4-4.2 1.8-1.7v-1.9L2.7 9.8l2.4-4.2 2.4.8 1.6-.9z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </nav>
    <header>
      <div class="bar">
        <button type="button" id="back" class="icon" aria-label="목록으로" hidden>&#8592;</button>
        <div class="heading">
          <h1 id="room-title">OnlyDM</h1>
          <p id="hint" hidden></p>
        </div>
        <select id="profiles" aria-label="계정 전환" hidden></select>
        <button type="button" id="retry" class="icon" aria-label="새로고침">&#8635;</button>
      </div>
      <div class="search" hidden>
        <input id="search" type="search" maxlength="200" placeholder="대화 검색" aria-label="대화 검색">
      </div>
    </header>
    <main>
      <p id="status" role="status" aria-live="polite">OnlyDM을 여는 중입니다.</p>
    </main>
    <dialog id="settings-dialog" aria-labelledby="settings-heading">
      <div class="settings-header">
        <h2 id="settings-heading">설정</h2>
        <button type="button" id="settings-close" class="icon" aria-label="닫기" autofocus>×</button>
      </div>
      <label class="settings-row">
        <span>
          <strong id="work-mode-label">열일 모드</strong>
          <span id="work-mode-description"></span>
        </span>
        <input id="work-mode" class="switch" type="checkbox" role="switch" aria-labelledby="work-mode-label" aria-describedby="work-mode-description">
      </label>
      <p id="settings-error" role="alert" hidden></p>
    </dialog>
  </body>
</html>
