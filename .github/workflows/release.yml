name: Release OnlyDM

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        shell: pwsh
        run: dotnet restore .\OnlyDM.sln

      - name: Navigation policy tests
        shell: pwsh
        run: dotnet run --project .\tests\OnlyDM.NavigationPolicyTests\OnlyDM.NavigationPolicyTests.csproj -c Release --no-restore

      - name: Release build
        shell: pwsh
        run: dotnet build .\OnlyDM.sln -c Release --no-restore

      - name: Package x64
        shell: pwsh
        run: .\scripts\package.ps1 -RuntimeIdentifier win-x64 -Version ($env:RELEASE_TAG.Substring(1))

      - name: Package ARM64
        shell: pwsh
        run: .\scripts\package.ps1 -RuntimeIdentifier win-arm64 -Version ($env:RELEASE_TAG.Substring(1))

      - name: Verify release assets
        shell: pwsh
        run: |
          $required = @(
            "artifacts/OnlyDM-win-x64.zip",
            "artifacts/OnlyDM-win-x64.zip.sha256",
            "artifacts/OnlyDM-win-arm64.zip",
            "artifacts/OnlyDM-win-arm64.zip.sha256"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing release asset: $path"
            }
          }

      - name: Upload release inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            artifacts/OnlyDM-win-x64.zip
            artifacts/OnlyDM-win-x64.zip.sha256
            artifacts/OnlyDM-win-arm64.zip
            artifacts/OnlyDM-win-arm64.zip.sha256
            install.ps1
            uninstall.ps1

  build-linux:
    name: Build Ubuntu 24.04 amd64 preview
    runs-on: ubuntu-24.04
    env:
      ONLYDM_FIXTURE_SOFTWARE_RENDERING: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select Node.js 24
        shell: bash
        run: |
          if [[ $(node --version 2>/dev/null) == v24.* ]]; then
            exit 0
          fi
          for node_bin in "$RUNNER_TOOL_CACHE"/node/24.*/x64/bin; do
            if [[ -x "$node_bin/node" ]]; then
              printf '%s\n' "$node_bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "::error::Node.js 24 for x64 is unavailable on this runner."
          exit 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: "8.0.x"

      - name: Install Electron fixture prerequisites
        shell: bash
        run: |
          sudo timeout 180s apt-get update
          sudo timeout 180s apt-get install -y --no-install-recommends xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1

      - name: Build, test, and package
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          if [[ ! -f node_modules/electron/dist/chrome-sandbox ]]; then
            node node_modules/electron/install.js
          fi
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          npm run build
          npm run test
          dbus-run-session -- xvfb-run -a npm run test:ui
          # Return the fixture sandbox helper to the build user before copying package inputs.
          sudo chown "$(id -u):$(id -g)" node_modules/electron/dist/chrome-sandbox
          npm run package:deb

      - name: Prepare Linux release inputs
        shell: bash
        run: |
          shopt -s nullglob
          debs=(desktop/dist/onlydm_*_amd64.deb)
          if (( ${#debs[@]} != 1 )); then
            echo "::error::Expected one OnlyDM amd64 .deb, found ${#debs[@]}."
            exit 1
          fi
          install -Dm 0644 "${debs[0]}" artifacts/OnlyDM-linux-x64.deb
          cd artifacts
          sha256sum OnlyDM-linux-x64.deb > OnlyDM-linux-x64.deb.sha256

      - name: Upload Linux release inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-linux
          if-no-files-found: error
          path: |
            artifacts/OnlyDM-linux-x64.deb
            artifacts/OnlyDM-linux-x64.deb.sha256

  build-macos:
    name: Build macOS arm64 and x64 previews
    uses: ./.github/workflows/desktop.yml

  release:
    needs: [build, build-linux, build-macos]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-inputs/windows

      - name: Download Linux release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-linux
          path: release-inputs/linux

      - name: Download macOS release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: OnlyDM-mac-*-adhoc-preview
          merge-multiple: true
          path: release-inputs/macos

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag must match vMAJOR.MINOR.PATCH."
          }
          $assets = @(
            "release-inputs/windows/artifacts/OnlyDM-win-x64.zip",
            "release-inputs/windows/artifacts/OnlyDM-win-x64.zip.sha256",
            "release-inputs/windows/artifacts/OnlyDM-win-arm64.zip",
            "release-inputs/windows/artifacts/OnlyDM-win-arm64.zip.sha256",
            "release-inputs/windows/install.ps1",
            "release-inputs/windows/uninstall.ps1",
            "release-inputs/linux/OnlyDM-linux-x64.deb",
            "release-inputs/linux/OnlyDM-linux-x64.deb.sha256",
            "release-inputs/macos/OnlyDM-mac-arm64.dmg",
            "release-inputs/macos/OnlyDM-mac-arm64.dmg.sha256",
            "release-inputs/macos/OnlyDM-mac-arm64.json",
            "release-inputs/macos/OnlyDM-mac-x64.dmg",
            "release-inputs/macos/OnlyDM-mac-x64.dmg.sha256",
            "release-inputs/macos/OnlyDM-mac-x64.json"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Missing release input: $asset"
            }
          }
          foreach ($arch in @("arm64", "x64")) {
            $base = "release-inputs/macos/OnlyDM-mac-$arch"
            $checksum = (Get-Content -LiteralPath "$base.dmg.sha256" -Raw).Trim()
            if ($checksum -notmatch "^([a-fA-F0-9]{64})  OnlyDM-mac-$arch\.dmg$") {
              throw "Invalid macOS checksum file: $base.dmg.sha256"
            }
            if ((Get-FileHash -LiteralPath "$base.dmg" -Algorithm SHA256).Hash -ne $Matches[1]) {
              throw "macOS DMG checksum mismatch: $base.dmg"
            }
            $metadata = Get-Content -LiteralPath "$base.json" -Raw | ConvertFrom-Json
            if ($metadata.version -ne $env:RELEASE_TAG.Substring(1) -or
                $metadata.arch -ne $arch -or $metadata.platform -ne "darwin" -or
                $metadata.preview -ne $true -or $metadata.signing.status -ne "ad-hoc" -or
                $metadata.signing.developerId -ne $false -or
                $metadata.diskImage.filename -ne "OnlyDM-mac-$arch.dmg" -or
                $metadata.diskImage.signing -ne "unsigned" -or
                $metadata.notarization.status -ne "not-notarized") {
              throw "Invalid macOS preview metadata: $base.json"
            }
          }
          & gh release create $env:RELEASE_TAG @assets `
            --verify-tag `
            --generate-notes `
            --title $env:RELEASE_TAG
