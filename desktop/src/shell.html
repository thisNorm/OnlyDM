<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
    <title>OnlyDM</title>
    <link rel="stylesheet" href="shell.css">
    <script src="colors.js" defer></script>
    <script src="shell.js" defer></script>
  </head>
  <body data-pane="login">
    <div id="window-titlebar"><span>OnlyDM</span></div>
    <nav id="nav-rail" aria-label="OnlyDM" hidden>
      <button type="button" id="chats-icon" class="icon rail-icon selected" aria-label="채팅" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H9l-4.4 3v-4.2A3 3 0 0 1 4 15z"/>
          <path d="M8.5 10.5h.01m3.5 0h.01m3.5 0h.01"/>
        </svg>
      </button>
      <button type="button" id="friends-icon" class="icon rail-icon" aria-label="친구" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v2"/>
        </svg>
      </button>
      <button type="button" id="settings" class="icon rail-icon" aria-label="설정" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9.6 3h4.8l.5 2.5 1.6.9 2.4-.8 2.4 4.2-1.8 1.7v1.9l1.8 1.7-2.4 4.2-2.4-.8-1.6.9-.5 2.6H9.6l-.5-2.6-1.6-.9-2.4.8-2.4-4.2 1.8-1.7v-1.9L2.7 9.8l2.4-4.2 2.4.8 1.6-.9z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <button type="button" id="update" class="icon rail-icon" aria-label="업데이트" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12M6 9l6 6 6-6M4 17v4h16v-4"/>
        </svg>
      </button>
    </nav>
    <header>
      <div class="bar">
        <button type="button" id="back" class="icon" aria-label="목록으로" hidden>&#8592;</button>
        <div class="heading">
          <h1 id="room-title">OnlyDM</h1>
          <p id="hint" hidden></p>
        </div>
        <select id="profiles" aria-label="계정 전환" hidden></select>
        <button type="button" id="new-chat" class="icon" aria-label="새 채팅" aria-haspopup="dialog" aria-controls="new-chat-dialog" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 13v4a3 3 0 0 1-3 3H7l-4 2V7a3 3 0 0 1 3-3h6M18 2v8M14 6h8"/>
          </svg>
        </button>
        <div id="chat-controls" hidden>
          <button type="button" id="chat-voice" class="icon" aria-label="음성 통화" disabled>
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m8 3 3 5-3 2a14 14 0 0 0 6 6l2-3 5 3-1 4c-1 3-7 0-11-4S2 6 5 4z"/>
            </svg>
          </button>
          <button type="button" id="chat-video" class="icon" aria-label="영상 통화" disabled>
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 10 6-4v12l-6-4"/>
            </svg>
          </button>
          <button type="button" id="chat-info" class="icon" aria-label="채팅 정보" disabled>
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>
            </svg>
          </button>
        </div>
        <button type="button" id="retry" class="icon" aria-label="새로고침">&#8635;</button>
      </div>
      <div class="search" hidden>
        <input id="search" type="search" maxlength="200" placeholder="대화 검색" aria-label="대화 검색">
      </div>
    </header>
    <main>
      <p id="status" role="status" aria-live="polite">OnlyDM을 여는 중입니다.</p>
    </main>
    <dialog id="new-chat-dialog" aria-labelledby="new-chat-heading">
      <form id="new-chat-form">
        <div class="settings-header">
          <h2 id="new-chat-heading">새 채팅</h2>
          <button type="button" id="new-chat-close" class="icon" aria-label="닫기">×</button>
        </div>
        <input id="new-chat-search" type="search" maxlength="200" placeholder="이름 또는 사용자 이름 검색" aria-label="친구 검색" autocomplete="off" autofocus>
        <div id="new-chat-roster" role="group" aria-labelledby="new-chat-heading"></div>
        <p id="new-chat-empty" hidden></p>
        <p id="new-chat-count" role="status" aria-live="polite">0명 선택</p>
        <div class="dialog-actions">
          <button type="button" id="new-chat-cancel">취소</button>
          <button type="submit" id="new-chat-confirm" disabled>확인</button>
        </div>
      </form>
    </dialog>
    <dialog id="settings-dialog" aria-labelledby="settings-heading">
      <div class="settings-header">
        <h2 id="settings-heading">설정</h2>
        <button type="button" id="settings-close" class="icon" aria-label="닫기" autofocus>×</button>
      </div>
      <label class="settings-row">
        <span>
          <strong id="work-mode-label">열일 모드</strong>
          <span id="work-mode-description"></span>
        </span>
        <input id="work-mode" class="switch" type="checkbox" role="switch" aria-labelledby="work-mode-label" aria-describedby="work-mode-description">
      </label>
      <div class="chat-theme-row">
        <label for="language" id="language-label">언어</label>
        <select id="language">
          <option value="auto">Auto</option>
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>
      </div>
      <label class="settings-row">
        <strong id="notifications-enabled-label">알림</strong>
        <input id="notifications-enabled" class="switch" type="checkbox" role="switch" checked>
      </label>
      <label class="settings-row">
        <strong id="notification-preview-enabled-label">알림 미리보기</strong>
        <input id="notification-preview-enabled" class="switch" type="checkbox" role="switch" checked>
      </label>
      <label class="settings-row">
        <strong id="start-in-tray-label">트레이에서 시작</strong>
        <input id="start-in-tray" class="switch" type="checkbox" role="switch">
      </label>
      <label class="settings-row">
        <strong id="auto-start-label">로그인할 때 자동 실행</strong>
        <input id="auto-start" class="switch" type="checkbox" role="switch">
      </label>
      <div class="chat-theme-row">
        <label for="chat-theme" data-theme-label="theme">색상 모드</label>
        <select id="chat-theme">
          <option value="system" data-theme-label="system">시스템</option>
          <option value="light" data-theme-label="light">라이트</option>
          <option value="dark" data-theme-label="dark">다크</option>
          <option value="custom" data-theme-label="custom">커스텀</option>
        </select>
      </div>
      <div id="chat-custom-colors" hidden>
        <span id="chat-hex-label" hidden>HEX</span>
        <div id="app-preview" aria-hidden="true">
          <span class="app-preview-title" data-theme-label="appPreview">앱 미리보기</span>
          <span class="app-preview-rail"></span>
          <span class="app-preview-body" data-theme-label="appPreviewBody">채팅 · 친구 목록</span>
        </div>
        <div id="chat-preview" aria-hidden="true">
          <span class="preview-time">12:30</span>
          <span class="preview-incoming" data-theme-label="previewIncoming">안녕하세요!</span>
          <span class="preview-outgoing" data-theme-label="previewOutgoing">반가워요.</span>
        </div>
        <label for="color-target" data-theme-label="colorTarget">수정할 색상</label>
        <select id="color-target">
          <option value="app:chrome" data-theme-label="chrome">상단·사이드바</option>
          <option value="app:background" data-theme-label="appBackground">앱 배경</option>
          <option value="chat:background" data-theme-label="background">채팅 배경</option>
          <option value="chat:incoming" data-theme-label="incoming">받은 메시지</option>
          <option value="chat:outgoing" data-theme-label="outgoing">보낸 메시지</option>
        </select>
        <p id="color-presets-label" data-theme-label="presets">기본 팔레트</p>
        <div id="color-presets" role="group" aria-labelledby="color-presets-label"></div>
        <p id="color-spectrum-label" data-theme-label="spectrum">스펙트럼</p>
        <div id="color-spectrum" role="slider" tabindex="0" aria-labelledby="color-spectrum-label"
             aria-describedby="color-spectrum-help" aria-valuemin="0" aria-valuemax="100">
          <span id="color-spectrum-marker"></span>
        </div>
        <label for="color-hue" data-theme-label="hue">색조</label>
        <input id="color-hue" type="range" min="0" max="360" step="1" value="0">
        <p id="color-spectrum-help" data-theme-label="spectrumHelp">드래그하거나 화살표 키로 색을 고르세요.</p>
        <div class="chat-palette">
          <div data-color-field="app:chrome">
            <label id="app-chrome-label" for="app-chrome-color" data-theme-label="chrome">상단·사이드바</label>
            <input id="app-chrome-color" type="color">
            <input id="app-chrome-hex" type="text" spellcheck="false" autocomplete="off" aria-labelledby="app-chrome-label chat-hex-label">
          </div>
          <div data-color-field="app:background">
            <label id="app-background-label" for="app-background-color" data-theme-label="appBackground">앱 배경</label>
            <input id="app-background-color" type="color">
            <input id="app-background-hex" type="text" spellcheck="false" autocomplete="off" aria-labelledby="app-background-label chat-hex-label">
          </div>
          <div data-color-field="chat:background">
            <label id="chat-background-label" for="chat-background-color" data-theme-label="background">채팅 배경</label>
            <input id="chat-background-color" type="color">
            <input id="chat-background-hex" type="text" spellcheck="false" autocomplete="off" aria-labelledby="chat-background-label chat-hex-label">
          </div>
          <div data-color-field="chat:incoming">
            <label id="chat-incoming-label" for="chat-incoming-color" data-theme-label="incoming">받은 메시지</label>
            <input id="chat-incoming-color" type="color">
            <input id="chat-incoming-hex" type="text" spellcheck="false" autocomplete="off" aria-labelledby="chat-incoming-label chat-hex-label">
          </div>
          <div data-color-field="chat:outgoing">
            <label id="chat-outgoing-label" for="chat-outgoing-color" data-theme-label="outgoing">보낸 메시지</label>
            <input id="chat-outgoing-color" type="color">
            <input id="chat-outgoing-hex" type="text" spellcheck="false" autocomplete="off" aria-labelledby="chat-outgoing-label chat-hex-label">
          </div>
        </div>
        <p id="chat-hex-error" data-theme-label="hexError" role="status" hidden>HEX 6자리를 입력해 주세요. 예: #4257C9</p>
      </div>
      <button type="button" id="chat-theme-apply" data-theme-label="apply" disabled>적용</button>
      <button type="button" id="logout">로그아웃</button>
      <p id="settings-error" role="alert" hidden></p>
    </dialog>
  </body>
</html>
